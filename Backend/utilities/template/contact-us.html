<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form Submission</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background-color: #0d1117;
      padding: 20px;
      text-align: center;
      color: white;
    }
    .content {
      padding: 30px;
      color: #333;
    }
    .content p {
      margin: 10px 0;
    }
    .field-label {
      font-weight: bold;
      color: #555;
    }
    .footer {
      text-align: center;
      padding: 20px;
      background-color: #f1f1f1;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Contact Us Message</h1>
    </div>
    <div class="content">
      <p><span class="field-label">Name:</span> {{NAME}}</p>
      <p><span class="field-label">Phone No.:</span> {{PHONE}}</p>
      <p><span class="field-label">Email:</span> {{EMAIL}}</p>
      <p><span class="field-label">Company Name:</span> {{COMPANY}}</p>
      <p><span class="field-label">Country:</span> {{COUNTRY}}</p>
      <p><span class="field-label">Message:</span></p>
      <p>{{MESSAGE}}</p>
    </div>
    <div class="footer">
      &copy; 2025 YourCompany. All rights reserved.
    </div>
  </div>
</body>
</html>
